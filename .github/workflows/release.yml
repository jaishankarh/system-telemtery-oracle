name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: make test
      - name: Build static binaries (amd64, arm64)
        run: make build
      - name: Checksums and install script
        run: |
          cp scripts/install.sh dist/install.sh
          cd dist
          sha256sum sys-telemetry-app-linux-amd64 sys-telemetry-app-linux-arm64 > SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/sys-telemetry-app-linux-amd64
            dist/sys-telemetry-app-linux-arm64
            dist/SHA256SUMS
            dist/install.sh
